name: Tests validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  merge_group:

jobs:
  build-validation:
    name: CI (node${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [26, 24]

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node LTS version
        uses: actions/setup-node@v6
        with:
          cache: yarn
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        if: matrix.node != 26
        run: yarn test

      - name: Run tests
        if: matrix.node == 26
        run: yarn coverage

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: matrix.node == 26 && (github.event_name == 'pull_request')
        with:
          filename: coverage/cobertura-coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          indicators: true
          output: both

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3.0.2
        if: matrix.node == 26 && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        with:
          recreate: true
          path: code-coverage-results.md
